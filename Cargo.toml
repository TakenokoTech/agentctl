[package]
name = "agentctl"
version = "0.1.0"
edition = "2024"

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[dependencies]
a2a-rust = { version = "0.1.0", default-features = false, features = ["client"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false }
rmcp = { version = "3.8.0", features = ["client", "server", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

# E2E テストが子プロセスとして起動する MCP サーバ。`cargo test` が自動でビルドする。
[[example]]
name = "test_mcp_server"
path = "tests/fixtures/mcp_server.rs"

[dev-dependencies]
a2a-rust = { version = "0.1.0", features = ["server"] }
async-trait = "0.1.92"
axum = "0.8.9"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
syn = { version = "2", features = ["full", "visit"] }
